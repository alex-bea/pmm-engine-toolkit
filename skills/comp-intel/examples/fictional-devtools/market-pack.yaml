schema_version: 1
market_id: fictional-devtools
display_name: Fictional developer observability
status: example-only
fictional: true
market_boundary: >-
  Tools used by software teams to understand deployment health and team adoption after a
  release. General project management and infrastructure hosting are out of scope.
adopter_product: LaunchPad Analytics
default_mode: standard
window_convention: inclusive start, exclusive end
competitors:
  - competitor_id: bluepeak
    display_name: BluePeak
    status: active
    aliases: [Blue Peak, BluePeak Cloud]
  - competitor_id: cedarworks
    display_name: CedarWorks
    status: monitor
    aliases: [Cedar Works]
  - competitor_id: northstar-labs
    display_name: Northstar Labs
    status: watchlist
    aliases: [Northstar]
analysis_categories: [product, positioning, pricing, customer-evaluation, narrative]
max_executive_signals: 2
status_policy:
  active: verified material signal or live comparison in the last 30 days
  monitor: relevant signal in the last 90 days
  watchlist: adjacent competitor with a named trigger
  dormant: no material signal in the last 180 days

