name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
      - name: Install hash-locked build tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-build.lock
      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --no-build-isolation
          -r requirements.lock
      - name: Run tests
        run: python -m unittest discover -s tests

  governance:
    name: Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
      - name: Install hash-locked build tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-build.lock
      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip install --require-hashes --no-build-isolation
          -r requirements.lock
      - name: Validate workflows
        run: python scripts/governance/validate_github_actions.py
      - name: Validate public package
        run: python scripts/governance/validate_skill_pack.py
      - name: Verify generated IP inventory
        run: |
          python scripts/governance/build_ip_inventory.py
          git diff --exit-code -- docs/legal/IP-INVENTORY.csv
